name: Release Desktop Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Desktop App
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            daemon/package-lock.json
            client/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: Install Daemon Dependencies
        run: |
          cd daemon
          npm ci

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Verify Quality Assurance (Tests & Linter)
        run: |
          npm run test
          npm run lint

      - name: Build Daemon
        run: |
          cd daemon
          npm run build

      - name: Build Daemon Sidecar (Node SEA)
        run: |
          cd daemon
          npm run build:sidecar

      - name: Smoke Test Daemon Sidecar
        shell: pwsh
        run: |
          $exe = Get-ChildItem client/src-tauri/binaries/hosty-daemon-*.exe | Select-Object -First 1
          $env:NODE_ENV = 'production'
          $env:MC_NEXUS_PORT = '4871'
          $env:MC_NEXUS_INSTANCE_DIR = Join-Path $env:RUNNER_TEMP 'hosty-smoke/instances/default'
          $env:MC_NEXUS_ASSETS_DIR = (Resolve-Path daemon/assets/bridge).Path
          $proc = Start-Process -FilePath $exe.FullName -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:4871/api/health' -TimeoutSec 2
                $ok = $health.status -eq 'ok'
              } catch { }
            }
            if (-not $ok) { throw 'Daemon sidecar did not answer /api/health' }
            Write-Host 'Daemon sidecar healthy'
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Build Tauri Desktop Bundle & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: client
          tagName: ${{ github.ref_name }}
          releaseName: 'Hosty v__VERSION__'
          releaseBody: 'Automated release of Hosty desktop application.'
          releaseDraft: false
          prerelease: false
